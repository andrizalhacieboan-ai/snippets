<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#050507">
  <title>Login — AndriCode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  
  <!-- Google reCAPTCHA v3 Script dengan Site Key Anda -->
  <script src="https://www.google.com/recaptcha/api.js?render=6LeAbe0sAAAAANyNb124Qv8eert55r62SxrK1HRN"></script>
</head>
<body>
  <div class="grid-glow"></div>

  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">AC</span><span>Andri<span class="accent">Code</span></span></a>
    <nav class="menu"><a href="/">Home</a><a href="/upload">Upload</a><a href="/profile">Profil</a><a href="/dashboard">Admin</a></nav>
    <div class="topbar-right" id="topbarAuth"></div>
  </header>

  <main>
    <div class="login-container">
      <div class="login-card glass-panel">
        <div class="login-brand">
          <div class="brand-mark">AC</div>
          <h1>Selamat Datang</h1>
          <p>Login atau daftar untuk mulai berbagi kode</p>
        </div>

        <div class="login-tabs">
          <button class="login-tab active" data-tab="login">Login</button>
          <button class="login-tab" data-tab="register">Daftar</button>
        </div>

        <form id="loginForm" class="form-grid">
          <div class="form-field">
            <label for="loginUser">Username</label>
            <input id="loginUser" name="username" placeholder="Username" autocomplete="username" required>
          </div>
          <div class="form-field">
            <label for="loginPass">Password</label>
            <input id="loginPass" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
          </div>
          <button class="btn primary full-width" type="submit">Login</button>
        </form>

        <form id="registerForm" class="form-grid hidden">
          <div class="form-field">
            <label for="regUser">Username</label>
            <input id="regUser" name="username" placeholder="Username (3-32 karakter)" autocomplete="username" required>
          </div>
          <div class="form-field">
            <label for="regPass">Password</label>
            <input id="regPass" name="password" type="password" placeholder="Password" autocomplete="new-password" required>
          </div>
          <button class="btn primary full-width" type="submit">Daftar</button>
        </form>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="/" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></a>
    <a href="/upload" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span>Upload</span></a>
    <a href="/profile" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profil</span></a>
    <a href="/dashboard" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>Admin</span></a>
  </nav>

  <div class="bottom-spacer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/login.js"></script>
</body>
</html>
