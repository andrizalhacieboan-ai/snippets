<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#090a1a">
  <title>Admin — AndriCode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="grid-glow"></div>

  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">AC</span>
      <span>Andri<span class="accent">Code</span></span>
    </a>
    <nav class="menu">
      <a href="/">Home</a>
      <a href="/upload">Upload</a>
      <a href="/profile">Profil</a>
      <a href="/dashboard" class="active">Admin</a>
    </nav>
    <div class="topbar-right" id="topbarAuth"></div>
  </header>

  <main>
    <!-- Admin Login Gate -->
    <div id="authGate">
      <div class="login-container">
        <div class="login-card">
          <div class="login-brand">
            <div class="brand-mark">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <h1>Admin Panel</h1>
            <p>Login admin untuk mengakses dashboard moderasi</p>
          </div>

          <form id="adminForm" class="form-grid">
            <div class="form-field">
              <label for="adminUser">Username Admin</label>
              <input id="adminUser" name="username" placeholder="Username admin" autocomplete="username" required>
            </div>
            <div class="form-field">
              <label for="adminPass">Password Admin</label>
              <input id="adminPass" name="password" type="password" placeholder="Password admin" autocomplete="current-password" required>
            </div>
            <button class="btn primary full-width" type="submit">Login Admin</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Admin Dashboard Content (Hidden by default) -->
    <div id="protectedContent" class="hidden">
      <div class="page-header">
        <p class="eyebrow">Dashboard</p>
        <h1>Admin Overview</h1>
      </div>

      <div id="statsGrid" class="stats-grid">
        <div class="stat-box"><strong>-</strong><span>Users</span></div>
        <div class="stat-box"><strong>-</strong><span>Snippets</span></div>
        <div class="stat-box"><strong>-</strong><span>Views</span></div>
        <div class="stat-box"><strong>-</strong><span>Salin</span></div>
      </div>

      <div class="section-heading" style="margin-top: 1.5rem;">
        <p class="eyebrow">Semua Snippet</p>
        <h2>Moderasi Konten</h2>
      </div>

      <div id="adminSnippets" class="admin-list">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="/" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </a>
    <a href="/upload" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span>Upload</span>
    </a>
    <a href="/profile" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Profil</span>
    </a>
    <a href="/dashboard" class="bottom-nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span>Admin</span>
    </a>
  </nav>

  <div class="bottom-spacer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/dashboard.js"></script>
</body>
</html>
