<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#090a1a">
  <title>Upload — AndriCode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="grid-glow"></div>

  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">AC</span>
      <span>Andri<span class="accent">Code</span></span>
    </a>
    <nav class="menu">
      <a href="/">Home</a>
      <a href="/upload" class="active">Upload</a>
      <a href="/profile">Profil</a>
      <a href="/dashboard">Admin</a>
    </nav>
    <div class="topbar-right" id="topbarAuth"></div>
  </header>

  <main>
    <!-- Auth Gate: tampil jika belum login -->
    <div id="authGate" class="auth-gate hidden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <h2>Login Diperlukan</h2>
      <p>Silakan login terlebih dahulu untuk upload snippet kode.</p>
      <a class="btn primary" href="/login">Login Sekarang</a>
    </div>

    <!-- Konten terproteksi -->
    <div id="protectedContent" class="hidden">
      <div class="page-header">
        <p class="eyebrow">Upload Kode</p>
        <h1>Tambahkan snippet baru</h1>
        <p>Bagikan potongan kode yang bermanfaat untuk developer lain.</p>
      </div>

      <form id="snippetForm" class="form-grid panel">
        <div class="two-col">
          <div class="form-field">
            <label for="snipTitle">Judul</label>
            <input id="snipTitle" name="title" placeholder="Contoh: Fetch API helper" required>
          </div>
          <div class="form-field">
            <label for="snipLang">Bahasa Pemrograman</label>
            <input id="snipLang" name="language" placeholder="JavaScript, PHP, Python..." required>
          </div>
        </div>
        <div class="form-field">
          <label for="snipDesc">Deskripsi</label>
          <textarea id="snipDesc" name="description" rows="3" placeholder="Jelaskan fungsi snippet ini" required></textarea>
        </div>
        <div class="form-field">
          <label for="snipCode">Kode</label>
          <textarea id="snipCode" name="code" rows="10" class="code-input" placeholder="Tempel kode di sini" required></textarea>
        </div>
        <button class="btn primary full-width" type="submit">Upload Snippet</button>
      </form>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="/" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </a>
    <a href="/upload" class="bottom-nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span>Upload</span>
    </a>
    <a href="/profile" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Profil</span>
    </a>
    <a href="/dashboard" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span>Admin</span>
    </a>
  </nav>

  <div class="bottom-spacer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/upload.js"></script>
</body>
</html>
