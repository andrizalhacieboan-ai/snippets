<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#090a1a">
  <title>Profil — AndriCode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="grid-glow"></div>

  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">AC</span>
      <span>Andri<span class="accent">Code</span></span>
    </a>
    <nav class="menu">
      <a href="/">Home</a>
      <a href="/upload">Upload</a>
      <a href="/profile" class="active">Profil</a>
      <a href="/dashboard">Admin</a>
    </nav>
    <div class="topbar-right" id="topbarAuth"></div>
  </header>

  <main>
    <!-- Auth Gate -->
    <div id="authGate" class="auth-gate hidden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <h2>Login Diperlukan</h2>
      <p>Silakan login untuk melihat profil dan snippet kamu.</p>
      <a class="btn primary" href="/login">Login Sekarang</a>
    </div>

    <!-- Protected Content -->
    <div id="protectedContent" class="hidden">
      
      <!-- Profile Header -->
      <div class="profile-header-card">
        <div class="profile-avatar-wrapper">
          <img id="profileAvatarImg" src="" alt="Avatar" class="profile-avatar-img">
          <div class="avatar-overlay" id="avatarOverlay">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </div>
          <input type="file" id="avatarInput" accept="image/*" hidden>
        </div>
        
        <div class="profile-info">
          <div class="profile-name-row">
            <h2 id="profileName">Loading...</h2>
            <button class="btn-icon" id="editNameBtn" title="Edit Username">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
          </div>
          
          <form id="editNameForm" class="edit-name-form hidden">
            <input type="text" id="newUsernameInput" placeholder="Username baru" required>
            <button type="submit" class="btn primary sm">Simpan</button>
            <button type="button" class="btn ghost sm" id="cancelEditBtn">Batal</button>
          </form>

          <p class="muted" id="profileJoined">Bergabung sejak -</p>
        </div>
      </div>

      <!-- Interactive Stats -->
      <div class="profile-stats">
        <button class="stat-btn">
          <strong id="statSnippets">0</strong>
          <span>Snippet</span>
        </button>
        <button class="stat-btn">
          <strong id="statViews">0</strong>
          <span>Views</span>
        </button>
        <button class="stat-btn">
          <strong id="statCopies">0</strong>
          <span>Disalin</span>
        </button>
      </div>

      <div class="section-heading" style="margin-top: 1.5rem;">
        <p class="eyebrow">Snippet Saya</p>
        <h2>Karya Kamu</h2>
      </div>

      <div id="mySnippets" class="snippet-list">
        <div class="skeleton skeleton-card"></div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="/" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </a>
    <a href="/upload" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span>Upload</span>
    </a>
    <a href="/profile" class="bottom-nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Profil</span>
    </a>
    <a href="/dashboard" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span>Admin</span>
    </a>
  </nav>

  <div class="bottom-spacer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/profile.js"></script>
</body>
</html>
