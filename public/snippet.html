<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#090a1a">
  <title>Snippet — AndriCode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="grid-glow"></div>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">AC</span><span>Andri<span class="accent">Code</span></span></a>
    <nav class="menu"><a href="/">Home</a><a href="/upload">Upload</a><a href="/profile">Profil</a><a href="/dashboard">Admin</a></nav>
    <div class="topbar-right" id="topbarAuth"></div>
  </header>

  <main>
    <div class="snippet-detail-header" id="snippetHeader"></div>
    <div class="snippet-detail-code panel" id="snippetCodeBlock"></div>
    <div class="snippet-detail-actions" id="snippetActions">
      <button class="btn primary" id="copyBtn">Salin Kode</button>
      <a class="btn ghost" id="rawBtn" href="#" target="_blank">Raw Code</a>
      <button class="btn ghost" id="shareBtn">Bagikan Link</button>
    </div>

    <!-- Kolom Komentar Real-Time -->
    <div class="comments-section panel" id="commentsSection">
      <div class="section-heading" style="margin-bottom: 1rem;">
        <h2>Komentar <span class="muted" id="commentCount">(0)</span></h2>
      </div>
      
      <div id="commentAuthGate" class="hidden" style="text-align:center; padding: 1rem 0;">
        <p class="muted">Login untuk berkomentar.</p>
        <a href="/login" class="btn primary sm">Login</a>
      </div>

      <form id="commentForm" class="comment-form hidden">
        <textarea id="commentInput" rows="3" placeholder="Tulis komentar..." required maxlength="500"></textarea>
        <button type="submit" class="btn primary sm">Kirim</button>
      </form>

      <div id="commentList" class="comment-list">
        <div class="skeleton" style="height:40px; margin-bottom:0.5rem;"></div>
        <div class="skeleton" style="height:40px;"></div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="/" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></a>
    <a href="/upload" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span>Upload</span></a>
    <a href="/profile" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profil</span></a>
    <a href="/dashboard" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>Admin</span></a>
    <a href="/script" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span>Scripts</span></a>
  </nav>

  <div class="bottom-spacer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/snippet.js"></script>
</body>
</html>
